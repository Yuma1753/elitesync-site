<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EliteSync メールアドレスの確認</title>
<style>
:root { color-scheme: light dark; --fg: #161c20; --sub: #41484d; --bg: #f2f4f5; --card: #fff; --link: #006e9c; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #dee3e7; --sub: #c0c7cd; --bg: #0f1417; --card: #1a2025; --link: #8ccfff; }
}
body { margin: 0; background: var(--bg); color: var(--fg); line-height: 1.8;
       font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
article { background: var(--card); border-radius: 16px; padding: 24px; }
h1 { font-size: 1.5rem; line-height: 1.4; margin: 0 0 16px; }
h2 { font-size: 1.1rem; margin: 32px 0 8px; }
p, li { color: var(--sub); }
ul { padding-left: 1.4em; }
a { color: var(--link); }
nav { margin: 16px 0; font-size: .9rem; }
</style>
</head>
<body>
<main>
<article>
<h1>メールアドレスを確認しました</h1>
<p>EliteSync への登録が完了しました。</p>
<p>アプリに戻って、登録したメールアドレスとパスワードでログインしてください。</p>
</article>
<nav><a href="./">サポート</a> ・ <a href="privacy.html">プライバシーポリシー</a></nav>
</main>
</body>
</html>
